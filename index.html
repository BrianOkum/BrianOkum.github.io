<body>

  <div class="header-rule"></div>

  <main class="home-content">

    <!-- Mobile fallback: simple stacked navigation. Hidden on desktop. -->
    <nav class="home-mobile-nav" aria-label="Site sections">
      <a href="about.html" class="home-mobile-link">
        <span class="home-mobile-num">01</span>
        <span class="home-mobile-label">About</span>

    <div class="cad-stage" data-state="default">

      <!-- Image layer stack — DEFAULT shows by default; others fade in on state change.
           Source: KeyShot export, 3840 × 2400, transparent PNG. -->
      <img class="layer-default"      src="images/index_DEFAULT.0.png"   alt="Exploded mechanical assembly representing the portfolio sections">
      <img class="layer-about"        src="images/index_ABOUT.png"       alt="">
      <img class="layer-portfolio"    src="images/index_PORTFOLIO.png"   alt="">
      <img class="layer-contact"      src="images/index_CONTACT.png"     alt="">
      <img class="layer-insights"     src="images/index_INSIGHTS.png"    alt="">
      <img class="layer-visualcomms"  src="images/index_VISCOMM.png"     alt="">
      <img class="layer-userenable"   src="images/index_USERENABLE.png"  alt="">
      <img class="layer-qualcomp"     src="images/index_QUALCOM.png"     alt="">
      <img class="layer-singsource"   src="images/index_SINGSOURCE.png"  alt="">
      <img class="layer-procdev"      src="images/index_PROCDEV.png"     alt="">
      <img class="layer-resume"       src="images/index_RESUME.png"      alt="">

      <svg class="cad-overlay" viewBox="0 180 3840 2220" preserveAspectRatio="xMidYMid meet">

        <!-- =================== HOT ZONES =================== -->
        <!-- Coordinates derived from the KeyShot layers themselves: each hover PNG
             was diffed against index_DEFAULT.0.png, and the convex hull of the
             resulting highlight mask was reduced to its 8 most significant
             vertices. An earlier 4-point version (left/top/right/bottom extremes)
             was a bad fit on parts that change diameter — it covered only 49.5%
             of INSIGHTS, leaving its flared socket end unhoverable. These hulls
             cover 94-98% of each part. -->
        <polygon class="hotzone" data-target="about"     points="428,489 557,394 817,524 975,635 962,741 900,787 711,725 447,593"/>
        <polygon class="hotzone" data-target="portfolio" points="989,770 1011,720 1084,685 1402,844 1414,936 1365,993 1326,996 1006,836"/>
        <polygon class="hotzone" data-target="insights"  points="2145,1322 2210,1280 2539,1395 2639,1472 2659,1608 2539,1620 2448,1578 2157,1382"/>
        <polygon class="hotzone" data-target="contact"   points="2665,1542 2740,1562 3054,1719 3632,2014 3595,2085 3008,1797 2690,1638 2642,1599"/>
        <!-- RESUME hot zone: the washer between the PORTFOLIO cluster and the INSIGHTS connector -->
        <ellipse class="hotzone" data-target="resume"    cx="2065" cy="1275" rx="95" ry="115"/>
        <!-- Sub-callout hot zones: the 5 dowel pins in the lower-left cluster.
             Pin radius is ~29u; hot zones are enlarged to 48u for easier hovering. -->
        <circle class="hotzone" data-target="visualcomms"  cx="1396" cy="1071" r="48"/>
        <circle class="hotzone" data-target="userenable"   cx="1385" cy="1259" r="48"/>
        <circle class="hotzone" data-target="qualcomp"     cx="1465" cy="1389" r="48"/>
        <circle class="hotzone" data-target="singsource"   cx="1623" cy="1382" r="48"/>
        <circle class="hotzone" data-target="procdev"      cx="1773" cy="1257" r="48"/>

        <!-- =================== ASSEMBLY LINES ===================
             Construction geometry derived from the render, not drawn by hand.

             THRUST AXIS: the centroids of the ten coaxial components (end pin,
             disc, barrel, sleeve, collar, cage, collar, washer, connector,
             shaft) were least-squares fitted to y = 0.49981x + 242.04 — a 26.57°
             line that every centroid sits within 4.3u of, confirming the parts
             really are coaxial. The centreline runs the full length and
             overshoots both ends, drawn dash-dot in the usual convention.

             RADIAL LINES: ten rollers seat in the cage at (1633,1061). Each line
             runs from its roller toward the cage centre, ray-marched against the
             occupancy mask so it stops at the cage with the same 17u gap the
             leaders use. Two rollers are occluded by the collar; their lines run
             flush into its edge so they read as passing behind it. -->
        <g class="assembly-lines" aria-hidden="true">
          <path class="axis-line" d="M38 261 L3795 2139"/>
          <path class="radial-line" d="M1417 1233 L1551 1126"/>  <!-- roller 1385,1259 -->
          <path class="radial-line" d="M1482 1355 L1586 1152"/>  <!-- roller 1465,1389 -->
          <path class="radial-line" d="M1624 1342 L1630 1166"/>  <!-- roller 1623,1382 -->
          <path class="radial-line" d="M1649 784 L1639 956"/>  <!-- roller 1651,743 -->
          <path class="radial-line" d="M1746 1220 L1686 1135"/>  <!-- roller 1773,1257 -->
          <path class="radial-line" d="M1780 776 L1680 970"/>  <!-- roller 1797,742 -->
          <path class="radial-line" d="M1827 1063 L1724 1062"/>  <!-- roller 1873,1064 -->
          <path class="radial-line" d="M1843 890 L1714 995"/>  <!-- roller 1875,864 -->
          <path class="radial-line" d="M1443 1069 L1480 1067"/>  <!-- roller 1396,1071 — occluded, runs flush under the collar -->
          <path class="radial-line" d="M1526 912 L1541 933"/>  <!-- roller 1498,874 — occluded, runs flush under the collar -->
        </g>

        <!-- =================== MAIN CALLOUTS =================== -->
        <!-- Leader rules, applied uniformly:
             • Every leader is a short horizontal stub off the text, then a 45°
               run to the part (02.5 adds a final 90° rise — see its note).
             • Stubs start 45u clear of the text edge and never touch a glyph.
             • Every leader stops the same distance short of its part: the 45°
               ray was cast against the DEFAULT layer's occupancy mask and backed
               off 24u, giving an identical 17u perpendicular gap on all ten.
             • Lines only — no terminator dots. -->

        <!-- 01 ABOUT → knurled barrel, top left. -->
        <g class="callout main-callout callout-about" data-target="about">
          <text class="label-num"  x="880" y="270">01</text>
          <text class="label-name" x="880" y="319">ABOUT</text>
          <text class="label-desc" x="880" y="352">personal background</text>
          <path class="leader-hit" d="M835 319 L775 319 L669 425"/>
          <path class="leader"     d="M835 319 L775 319 L669 425"/>
        </g>

        <!-- 02 PORTFOLIO → plain sleeve, second from left. -->
        <g class="callout main-callout callout-portfolio" data-target="portfolio">
          <text class="label-num"  x="555" y="967">02</text>
          <text class="label-name" x="555" y="1016">PORTFOLIO</text>
          <text class="label-desc" x="555" y="1049">selected work</text>
          <path class="leader-hit" d="M911 1016 L971 1016 L1086 901"/>
          <path class="leader"     d="M911 1016 L971 1016 L1086 901"/>
        </g>

        <!-- 03 RESUME → washer at mid-assembly. Label sits high and right so the
             45° run is long enough to keep clear of the 04 INSIGHTS block below.
             Clicking the part or this callout opens the resume PDF in a new tab.
             The PDF (not the page HTML) carries phone/contact details, keeping
             them out of scrape-able page markup. -->
        <g class="callout main-callout callout-resume" data-target="resume">
          <text class="label-num"  x="2513" y="887">03</text>
          <text class="label-name" x="2513" y="936">RESUME</text>
          <text class="label-desc" x="2513" y="969">view / download PDF</text>
          <path class="leader-hit" d="M2468 936 L2408 936 L2162 1182"/>
          <path class="leader"     d="M2468 936 L2408 936 L2162 1182"/>
        </g>

        <!-- 04 INSIGHTS → stepped connector body, right of the washer. -->
        <g class="callout main-callout callout-insights" data-target="insights">
          <text class="label-num"  x="2656" y="1209">04</text>
          <text class="label-name" x="2656" y="1258">INSIGHTS</text>
          <text class="label-desc" x="2656" y="1291">articles &amp; ideas</text>
          <path class="leader-hit" d="M2611 1258 L2551 1258 L2453 1356"/>
          <path class="leader"     d="M2611 1258 L2551 1258 L2453 1356"/>
        </g>

        <!-- 05 CONTACT → long output shaft, bottom right. -->
        <g class="callout main-callout callout-contact" data-target="contact">
          <text class="label-num"  x="3105" y="1495">05</text>
          <text class="label-name" x="3105" y="1544">CONTACT</text>
          <text class="label-desc" x="3105" y="1577">get in touch</text>
          <path class="leader-hit" d="M3060 1544 L3000 1544 L2918 1626"/>
          <path class="leader"     d="M3060 1544 L3000 1544 L2918 1626"/>
        </g>

        <!-- =================== SUB-CALLOUTS (visible only in portfolio mode) ===================
             The five portfolio sections are children of 02 PORTFOLIO, so they are
             numbered 02.1–02.5. They stack in the empty space below the assembly,
             right-aligned (text-anchor="end") to a common edge at x=1094. Pulling
             that edge left buys room for longer 45° runs, so each leader stands
             well off the pin cluster. Sub type sits one step below the main
             callouts (35/45px vs 45/54px), so the line spacing tightens to
             175u and 02.5's baseline lands at y1988 — clear of y2085, the
             lowest point of the CONTACT shaft. All five 45° runs are
             parallel, so they never cross. -->

        <!-- 02.1 VISUAL COMMUNICATIONS → upper-left pin -->
        <g class="callout sub-callout callout-visualcomms" data-target="visualcomms" text-anchor="end">
          <text class="label-num"  x="1094" y="1242">02.1</text>
          <text class="label-name" x="1094" y="1288">VISUAL COMMUNICATIONS</text>
          <path class="leader-hit" d="M1139 1288 L1179 1288 L1364 1103"/>
          <path class="leader"     d="M1139 1288 L1179 1288 L1364 1103"/>
        </g>

        <!-- 02.2 USER ENABLEMENT → lower-left pin -->
        <g class="callout sub-callout callout-userenable" data-target="userenable" text-anchor="end">
          <text class="label-num"  x="1094" y="1417">02.2</text>
          <text class="label-name" x="1094" y="1463">USER ENABLEMENT</text>
          <path class="leader-hit" d="M1139 1463 L1181 1463 L1353 1291"/>
          <path class="leader"     d="M1139 1463 L1181 1463 L1353 1291"/>
        </g>

        <!-- 02.3 QUALITY & COMPLIANCE → bottom-left pin -->
        <g class="callout sub-callout callout-qualcomp" data-target="qualcomp" text-anchor="end">
          <text class="label-num"  x="1094" y="1592">02.3</text>
          <text class="label-name" x="1094" y="1638">QUALITY &amp; COMPLIANCE</text>
          <path class="leader-hit" d="M1139 1638 L1216 1638 L1433 1421"/>
          <path class="leader"     d="M1139 1638 L1216 1638 L1433 1421"/>
        </g>

        <!-- 02.4 SINGLE-SOURCING → bottom-centre pin. Like 02.5 it finishes with
             a short 90° rise instead of running 45° all the way in. The 55u rise
             pushes the diagonal's start right, keeping 249u of clearance from
             the 02.3 leader at x=1433 and letting the stack read evenly from
             02.3 through 02.5. -->
        <g class="callout sub-callout callout-singsource" data-target="singsource" text-anchor="end">
          <text class="label-num"  x="1094" y="1767">02.4</text>
          <text class="label-name" x="1094" y="1813">SINGLE-SOURCING</text>
          <path class="leader-hit" d="M1139 1813 L1290 1813 L1623 1480 L1623 1425"/>
          <path class="leader"     d="M1139 1813 L1290 1813 L1623 1480 L1623 1425"/>
        </g>

        <!-- 02.5 PROCESS DEVELOPMENT → right-hand pin. A 45° run straight into
             this pin would clip the 02.4 pin en route, so the diagonal stops short
             at x=1773 and a 90° rise finishes the approach from below. -->
        <g class="callout sub-callout callout-procdev" data-target="procdev" text-anchor="end">
          <text class="label-num"  x="1094" y="1942">02.5</text>
          <text class="label-name" x="1094" y="1988">PROCESS DEVELOPMENT</text>
          <path class="leader-hit" d="M1139 1988 L1330 1988 L1773 1545 L1773 1300"/>
          <path class="leader"     d="M1139 1988 L1330 1988 L1773 1545 L1773 1300"/>
        </g>

      </svg>
    </div>

  </main>
