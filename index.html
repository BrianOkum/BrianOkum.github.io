<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brian Okum — Technical Writer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>

  <!-- ========== STICKY HEADER ========== -->
  <header class="site-header">
    <a href="index.html" class="header-left" aria-label="Home">
      <h1 class="name">Brian Okum</h1>
      <p class="title">Technical Writer</p>
    </a>
    <nav class="header-nav">
      <a href="about.html" class="nav-link">About</a>
      <a href="portfolio.html" class="nav-link">Portfolio</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </nav>
  </header>

  <div class="header-rule"></div>

  <main class="home-content">

    <!-- Mobile fallback: simple stacked navigation. Hidden on desktop. -->
    <nav class="home-mobile-nav" aria-label="Site sections">
      <a href="about.html" class="home-mobile-link">
        <span class="home-mobile-num">01</span>
        <span class="home-mobile-label">About</span>
        <span class="home-mobile-desc">personal background</span>
      </a>
      <a href="portfolio.html" class="home-mobile-link">
        <span class="home-mobile-num">02</span>
        <span class="home-mobile-label">Portfolio</span>
        <span class="home-mobile-desc">selected work</span>
      </a>
      <a href="contact.html" class="home-mobile-link">
        <span class="home-mobile-num">03</span>
        <span class="home-mobile-label">Contact</span>
        <span class="home-mobile-desc">get in touch</span>
      </a>
    </nav>

    <div class="cad-stage" data-state="default">

      <!-- Image layer stack — DEFAULT shows by default; others fade in on state change -->
      <img class="layer-default"      src="images/exploded-view-DEFAULT.png"      alt="Exploded mechanical assembly representing the portfolio sections">
      <img class="layer-about"        src="images/exploded-view-ABOUT.png"        alt="">
      <img class="layer-portfolio"    src="images/exploded-view-PORTFOLIO.png"    alt="">
      <img class="layer-contact"      src="images/exploded-view-CONTACT.png"      alt="">
      <img class="layer-visualcomms"  src="images/exploded-view-VISUALCOMMS.png"  alt="">
      <img class="layer-userenable"   src="images/exploded-view-USERENABLE.png"   alt="">
      <img class="layer-qualcomp"     src="images/exploded-view-QUALCOMP.png"     alt="">
      <img class="layer-singsource"   src="images/exploded-view-SINGSOURCE.png"   alt="">
      <img class="layer-procdev"      src="images/exploded-view-PROCDEV.png"      alt="">

      <svg class="cad-overlay" viewBox="0 0 5076 1500" preserveAspectRatio="xMidYMid meet">

        <!-- =================== HOT ZONES =================== -->
        <!-- All positions recalibrated against the new 5076×1928 PNG export.
             Parts shifted UP ~17px vs the previous export. -->
        <polygon class="hotzone" data-target="about" points="300,605 1860,797 1860,947 300,755"/>
        <rect    class="hotzone" data-target="portfolio" x="2173" y="802"  width="690"  height="275"/>
        <rect    class="hotzone" data-target="contact"   x="3658" y="1012" width="750"  height="340"/>
        <!-- Sub-callout hot zones: 5 bearings clustered between PORTFOLIO and CONTACT -->
        <circle class="hotzone" data-target="visualcomms"  cx="2989" cy="816"  r="45"/>
        <circle class="hotzone" data-target="userenable"   cx="2914" cy="960"  r="45"/>
        <circle class="hotzone" data-target="qualcomp"     cx="3055" cy="883"  r="45"/>
        <circle class="hotzone" data-target="singsource"   cx="2903" cy="1176" r="45"/>
        <circle class="hotzone" data-target="procdev"      cx="2970" cy="1246" r="45"/>

        <!-- =================== MAIN CALLOUTS =================== -->

        <!-- 01 ABOUT → long shaft (left). Shifted right another 100u (was 420, now 520).
             Dot anchor also moved right 100u to keep the leader proportional, and
             lifted further off the shaft top to widen the visible gap. -->
        <g class="callout main-callout callout-about" data-target="about">
          <text class="label-num"  x="520" y="380">01</text>
          <text class="label-name" x="520" y="445">ABOUT</text>
          <text class="label-desc" x="520" y="488">personal background</text>
          <path class="leader-hit" d="M720 445 L1000 445 L1000 620"/>
          <path class="leader"     d="M720 445 L1000 445 L1000 620"/>
          <circle class="dot" cx="1000" cy="620" r="10"/>
        </g>

        <!-- 02 PORTFOLIO → middle subassembly -->
        <g class="callout main-callout callout-portfolio" data-target="portfolio">
          <text class="label-num"  x="1950" y="380">02</text>
          <text class="label-name" x="1950" y="445">PORTFOLIO</text>
          <text class="label-desc" x="1950" y="488">selected work</text>
          <path class="leader-hit" d="M2240 445 L2500 445 L2500 810"/>
          <path class="leader"     d="M2240 445 L2500 445 L2500 810"/>
          <circle class="dot" cx="2500" cy="810" r="10"/>
        </g>

        <!-- 03 CONTACT → large cylinder on right.
             Label and dot dropped further down so the dot sits CLEARLY below the
             cylinder's visible shadow (which extends to y≈1353). Dot at y=1360
             is just below that boundary, so the leader is no longer on the part. -->
        <g class="callout main-callout callout-contact" data-target="contact">
          <text class="label-num"  x="3300" y="1370">03</text>
          <text class="label-name" x="3300" y="1435">CONTACT</text>
          <text class="label-desc" x="3300" y="1478">get in touch</text>
          <path class="leader-hit" d="M3610 1435 L4030 1435 L4030 1360"/>
          <path class="leader"     d="M3610 1435 L4030 1435 L4030 1360"/>
          <circle class="dot" cx="4030" cy="1360" r="10"/>
        </g>

        <!-- =================== SUB-CALLOUTS (visible only in portfolio mode) =================== -->

        <!-- 02.1 VISUAL COMMUNICATIONS → top bearing -->
        <g class="callout sub-callout callout-visualcomms" data-target="visualcomms">
          <text class="label-num"  x="3700" y="110">02.1</text>
          <text class="label-name" x="3700" y="170">VISUAL COMMUNICATIONS</text>
          <path class="leader-hit" d="M3675 170 L3350 170 L2989 816"/>
          <path class="leader"     d="M3675 170 L3350 170 L2989 816"/>
          <circle class="dot" cx="2989" cy="816" r="8"/>
        </g>

        <!-- 02.2 USER ENABLEMENT → middle bearing -->
        <g class="callout sub-callout callout-userenable" data-target="userenable">
          <text class="label-num"  x="3700" y="290">02.2</text>
          <text class="label-name" x="3700" y="350">USER ENABLEMENT</text>
          <path class="leader-hit" d="M3675 350 L3400 350 L2914 960"/>
          <path class="leader"     d="M3675 350 L3400 350 L2914 960"/>
          <circle class="dot" cx="2914" cy="960" r="8"/>
        </g>

        <!-- 02.3 QUALITY & COMPLIANCE → upper-right bearing -->
        <g class="callout sub-callout callout-qualcomp" data-target="qualcomp">
          <text class="label-num"  x="3700" y="470">02.3</text>
          <text class="label-name" x="3700" y="530">QUALITY &amp; COMPLIANCE</text>
          <path class="leader-hit" d="M3675 530 L3400 530 L3055 883"/>
          <path class="leader"     d="M3675 530 L3400 530 L3055 883"/>
          <circle class="dot" cx="3055" cy="883" r="8"/>
        </g>

        <!-- 02.4 SINGLE-SOURCING → lower-left bearing. Lifted higher so the gap
             between 02.4 name and 02.5 num matches the 120u spacing used by 02.1-02.3. -->
        <g class="callout sub-callout callout-singsource" data-target="singsource">
          <text class="label-num"  x="1700" y="1230">02.4</text>
          <text class="label-name" x="1700" y="1290">SINGLE-SOURCING</text>
          <path class="leader-hit" d="M2360 1290 L2600 1290 L2903 1176"/>
          <path class="leader"     d="M2360 1290 L2600 1290 L2903 1176"/>
          <circle class="dot" cx="2903" cy="1176" r="8"/>
        </g>

        <!-- 02.5 PROCESS DEVELOPMENT → bottom bearing. Sits 120u below 02.4 (matches 02.1-02.3 spacing). -->
        <g class="callout sub-callout callout-procdev" data-target="procdev">
          <text class="label-num"  x="1700" y="1410">02.5</text>
          <text class="label-name" x="1700" y="1470">PROCESS DEVELOPMENT</text>
          <path class="leader-hit" d="M2475 1470 L2750 1470 L2970 1246"/>
          <path class="leader"     d="M2475 1470 L2750 1470 L2970 1246"/>
          <circle class="dot" cx="2970" cy="1246" r="8"/>
        </g>

      </svg>
    </div>

  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="site-footer">
    <p class="footer-text">Brian Okum 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
